<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A05AFF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#primaryGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />

  <!-- Dormitory / School Building & Roof -->
  <!-- Roof / Gable -->
  <path d="M 32 12 L 14 26 L 18 26 L 18 49 C 18 50.5 19.5 51.5 21 51.5 L 43 51.5 C 44.5 51.5 46 50.5 46 49 L 46 26 L 50 26 Z" fill="#FFFFFF" fill-opacity="0.95" />
  
  <!-- Chimney / Tower Accent -->
  <path d="M 40 16 L 44 16 L 44 23 L 40 20 Z" fill="#E2E8F0" />

  <!-- Front Door / Archway -->
  <path d="M 28 51.5 L 28 39 C 28 36.8 29.8 35 32 35 C 34.2 35 36 36.8 36 39 L 36 51.5 Z" fill="#6D28D9" />

  <!-- Windows (Dorm Rooms) -->
  <rect x="22" y="30" width="4" height="5" rx="1" fill="#8B5CF6" />
  <rect x="38" y="30" width="4" height="5" rx="1" fill="#8B5CF6" />
  <rect x="22" y="39" width="4" height="5" rx="1" fill="#8B5CF6" />
  <rect x="38" y="39" width="4" height="5" rx="1" fill="#8B5CF6" />

  <!-- Circular Badge / Star on Roof -->
  <circle cx="32" cy="23" r="3.5" fill="url(#goldGrad)" />

  <!-- Checkmark / Activity badge in lower right corner -->
  <circle cx="48" cy="48" r="9.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
  <path d="M 44.5 48 L 47 50.5 L 52 45.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
