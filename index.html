<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ระบบบริหารจัดการหอพักนักเรียน</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" crossorigin="anonymous">
    <script type="text/javascript">
      // GitHub Pages SPA decoder & trailing-slash immediate redirect
      (function() {
        var l = window.location;
        // If accessed on a repo path without trailing slash (e.g. /SCSM), immediately redirect to /SCSM/ so relative ./assets/ work properly
        if (l.pathname && !l.pathname.endsWith('/') && !l.pathname.split('/').pop().includes('.')) {
          l.replace(l.protocol + '//' + l.host + l.pathname + '/' + l.search + l.hash);
          return;
        }
        // Decode SPA redirect from 404.html if present
        if (l.search && l.search.indexOf('p=') !== -1) {
          var params = new URLSearchParams(l.search);
          var redirectPath = params.get('p');
          if (redirectPath) {
            var cleanPath = decodeURIComponent(redirectPath).replace(/^\//, '');
            var baseDir = l.pathname.replace(/\/$/, '');
            var newUrl = baseDir + '/' + cleanPath;
            window.history.replaceState(null, '', newUrl + l.hash);
          }
        }
      })();
    </script>
  </head>
  <body class="bg-[#f2f4f9]">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Sarabun', sans-serif; background-color: #f2f4f9; color: #334155; padding: 16px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3px solid #e2e8f0; border-top-color: #A05AFF; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <div style="margin-top: 16px; font-weight: 700; font-size: 15px; color: #4c1d95;">ระบบบริหารจัดการหอพักนักเรียน</div>
        <div id="loading-status-text" style="margin-top: 4px; font-size: 12px; color: #64748b;">กำลังโหลดข้อมูล...</div>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
